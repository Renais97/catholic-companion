name: Catholic Companion Playwright Checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/playwright-iphone.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Prepare tests
        run: |
          mkdir -p tests
          cat > tests/catholic-companion.spec.cjs <<'EOF'
          const {test, expect, devices} = require('@playwright/test');
          const base = 'http://127.0.0.1:8765';
          test.use({ ...devices['iPhone 13'], browserName: 'webkit' });
          test('Home screen loads without script exceptions', async ({page}) => {
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto(base);
            await expect(page.locator('#home')).toHaveClass(/active/);
            await expect(page.locator('#home h1')).toContainText('Pray the Rosary');
            await page.waitForTimeout(600);
            expect(errors).toEqual([]);
          });
          test('Rosary choice and traditional prayer open', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await expect(page.locator('#picker')).toHaveClass(/active/);
            await page.getByRole('button', {name: /Pray the Traditional Rosary/i}).click();
            await expect(page.locator('#prayer')).toHaveClass(/active/);
            await expect(page.locator('#prayerContent')).not.toBeEmpty();
          });
          test('Scriptural Rosary launches', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Scriptural Rosary/i}).click();
            await expect(page.locator('#prayer')).toHaveClass(/active/);
            const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState') || '{}'));
            expect(saved.mode).toBe('scriptural');
          });
          test('Devotions and library cards open', async ({page}) => {
            await page.goto(base);
            const entries = [
              ['Angelus','#devotions'], ['Divine Mercy','#devotions'],
              ['Daily Prayers','#library'], ['Novenas','#library'],
              ['Catholic Bible','#devotions'], ['Liturgical Calendar','#devotions'],
              ['Rosary Mysteries','#library']
            ];
            for (const [name, id] of entries) {
              await page.goto(base);
              await page.locator('#home button.card').filter({hasText:name}).first().click();
              await expect(page.locator(id)).toHaveClass(/active/);
            }
          });
          test('Home content fits iPhone viewport without horizontal overflow', async ({page}) => {
            await page.goto(base);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 3);
            expect(overflow).toBe(false);
          });
          EOF
      - name: Start local website
        run: |
          test -f index.html || (echo 'Missing index.html in repository root' && exit 1)
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/catholic-companion-server.log 2>&1 &
          sleep 2
      - name: Run browser tests
        run: npx playwright test tests/catholic-companion.spec.cjs --reporter=html,line --workers=1
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catholic-companion-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
