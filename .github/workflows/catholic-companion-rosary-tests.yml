
name: Catholic Companion App Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/catholic-companion-rosary-tests.yml'

permissions:
  contents: read

jobs:
  mobile-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify expected app files
        run: |
          test -f index.html
          test -f service-worker.js
          test -f playwright.config.cjs
          test -f tests/catholic-companion.spec.cjs

      - name: Install Playwright and mobile browser engines
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Validate JavaScript and release versions
        run: node scripts/check-release.cjs

      - name: Run mobile regression tests
        run: npx playwright test --config=playwright.config.cjs
        env:
          CI: 'true'

      - name: Upload detailed report (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catholic-companion-mobile-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          
