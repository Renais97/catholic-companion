on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/playwright-iphone.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Prepare tests
        run: |
          mkdir -p tests
          cat > tests/catholic-companion.spec.cjs <<'EOF'
          const {test, expect, devices} = require('@playwright/test');
          const base = 'http://127.0.0.1:8765';
          test.use({ ...devices['iPhone 13'], browserName: 'webkit' });
          test('Home screen loads without script exceptions', async ({page}) => {
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto(base);
            await expect(page.locator('#home')).toHaveClass(/active/);
            await expect(page.locator('#home h1')).toContainText('Pray the Rosary');
            await page.waitForTimeout(600);
            expect(errors).toEqual([]);
          });
          test('Rosary choice and traditional prayer open', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await expect(page.locator('#picker')).toHaveClass(/active/);
            await page.getByRole('button', {name: /Pray the Traditional Rosary/i}).click();
            await expect(page.locator('#prayer')).toHaveClass(/active/);
            await expect(page.locator('#prayerContent')).not.toBeEmpty();
          });
          test('Scriptural Rosary launches', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Scriptural Rosary/i}).click();
            await expect(page.locator('#prayer')).toHaveClass(/active/);
            const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState') || '{}'));
            expect(saved.mode).toBe('scriptural');
          });
          test('Devotions and library cards open', async ({page}) => {
            await page.goto(base);
            const entries = [
              ['Angelus','#devotions'], ['Divine Mercy','#devotions'],
              ['Daily Prayers','#library'], ['Novenas','#library'],
              ['Catholic Bible','#devotions'], ['Liturgical Calendar','#devotions'],
              ['Rosary Mysteries','#library']
            ];
            for (const [name, id] of entries) {
              await page.goto(base);
              await page.locator('#home button.card').filter({hasText:name}).first().click();
              await expect(page.locator(id)).toHaveClass(/active/);
            }
          });
          test('Home content fits iPhone viewport without horizontal overflow', async ({page}) => {
            await page.goto(base);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 3);
            expect(overflow).toBe(false);
          });
          test('Rosary progress is saved after advancing and survives reload', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Traditional Rosary/i}).click();
            const initial = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState')).step);
            await page.evaluate(() => next());
            const advanced = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState')).step);
            expect(advanced).toBe(initial + 1);
            await page.reload();
            const restored = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState')).step);
            expect(restored).toBe(advanced);
          });
          test('Rosary back navigation restores previous prayer step', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Traditional Rosary/i}).click();
            await page.evaluate(() => { next(); next(); });
            const before = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState')).step);
            const didGoBack = await page.evaluate(() => previousRosary());
            const after = await page.evaluate(() => JSON.parse(localStorage.getItem('rosaryState')).step);
            expect(didGoBack).toBe(true);
            expect(after).toBe(before - 1);
          });
          test('Scriptural Rosary generates a scripture reference for each mystery', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Scriptural Rosary/i}).click();
            const check = await page.evaluate(() => {
              const output = [];
              for (let idx=0;idx<5;idx++) {
                state.step = introSteps.length + idx*5;
                renderPrayer();
                const ref = document.querySelector('#prayerContent .prayer-mystery-reference');
                output.push(ref?.textContent?.trim() || '');
              }
              return output;
            });
            expect(check).toHaveLength(5);
            for (const ref of check) expect(ref.length).toBeGreaterThan(2);
          });
          test('Rosary bead counters advance without exceeding 10', async ({page}) => {
            await page.goto(base);
            await page.getByRole('button', {name: /Pray today's Rosary/i}).click();
            await page.getByRole('button', {name: /Pray the Traditional Rosary/i}).click();
            const result = await page.evaluate(() => {
              state.step = introSteps.length + 2;
              state.hail = 1;
              renderPrayer();
              for (let n=0;n<15;n++) advanceRosaryBead();
              return {hail:state.hail, label:document.querySelector('#prayerContent .status')?.textContent || ''};
            });
            expect(result.hail).toBe(10);
            expect(result.label).toContain('10');
          });
          test('Weekly prayer section and its weekday controls render', async ({page}) => {
            await page.goto(base);
            await page.locator('#home button.card').filter({hasText:'Daily Prayers'}).first().click();
            await expect(page.locator('#library')).toHaveClass(/active/);
            const pageText = await page.locator('#library').innerText();
            expect(pageText.length).toBeGreaterThan(100);
          });
          EOF
      - name: Start local website
        run: |
          test -f index.html || (echo 'Missing index.html in repository root' && exit 1)
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/catholic-companion-server.log 2>&1 &
          sleep 2
      - name: Run browser tests
        run: npx playwright test tests/catholic-companion.spec.cjs --reporter=html,line --workers=1
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catholic-companion-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14